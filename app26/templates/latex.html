<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Éditeur LaTeX</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #172554;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            font-size: 18px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            min-height: 100px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            font-size: 24px;
            text-align: center;
        }

        .example {
            margin-top: 20px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Éditeur de formules mathématiques</h1>

    <p>
        Écrivez votre formule en LaTeX :
    </p>

    <textarea id="latexInput">
\frac{x^2+1}{x-1}
    </textarea>

    <div class="result" id="result"></div>

    <div class="example">
        <strong>Exemples :</strong>

        <p>
            Dérivée :
            <code>\frac{d}{dx}x^n = nx^{n-1}</code>
        </p>

        <p>
            Intégrale :
            <code>\int_0^1 x^2\,dx = \frac{1}{3}</code>
        </p>

        <p>
            Équation :
            <code>x^2 - 5x + 6 = 0</code>
        </p>
    </div>

</div>


<!-- MathJax -->
<script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
    };
</script>

<script async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>


<script>

    const input = document.getElementById("latexInput");
    const result = document.getElementById("result");


    function renderMath() {

        const latex = input.value;

        result.innerHTML = "\\[" + latex + "\\]";

        if (window.MathJax) {
            MathJax.typesetPromise([result]);
        }
    }


    input.addEventListener("input", renderMath);


    // Affichage initial
    window.addEventListener("load", renderMath);

</script>

</body>

</html>
