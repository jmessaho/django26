<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>LaTeX et Python</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 350px;
            font-family: monospace;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Éditeur LaTeX</h1>

<form method="post">

    {% csrf_token %}

    <textarea name="latex">\documentclass{article}

\usepackage{amsmath}

\begin{document}

\section*{Exemple}

Calculons :

\[
\int_0^1 x^2\,dx = \frac{1}{3}
\]

\[
(a+b)^2=a^2+2ab+b^2
\]

\end{document}</textarea>

    <br>

    <button type="submit">
        Générer le PDF
    </button>

</form>

</body>
</html>
